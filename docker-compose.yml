version: "3.9"

services:

  # -------------------- DATABASES --------------------

  postgres-order:
    image: postgres:16
    container_name: postgres-order
    environment:
      POSTGRES_DB: order-service
      POSTGRES_USER: suraj
      POSTGRES_PASSWORD: password
    ports:
      - "6431:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventory-service
      POSTGRES_USER: suraj
      POSTGRES_PASSWORD: password
    ports:
      - "6432:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: always

  keycloak-mysql:
    image: mysql:8
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    volumes:
      - mysql-keycloak-data:/var/lib/mysql
    networks:
      - app-network
    restart: always


  # -------------------- KEYCLOAK --------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-mysql
    networks:
      - app-network


  # -------------------- KAFKA --------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - app-network

  broker:
    image: confluentinc/cp-kafka:7.6.0
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    depends_on:
      - broker
    networks:
      - app-network


  # -------------------- OBSERVABILITY --------------------

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network


  # -------------------- SPRING MICROSERVICES --------------------

  discovery-server:
    image: surajshete49/docker-microservice-setup:discovery-server-1.1
    container_name: discovery-server
    ports:
      - "9761:9761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - zipkin
    networks:
      - app-network

  api-gateway:
    image: surajshete49/docker-microservice-setup:api-gateway-1.1
    container_name: api-gateway
    ports:
      - "9191:9191"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-server
    networks:
      - app-network

  product-service:
    image: surajshete49/docker-microservice-setup:product-service-1.1
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - mongo
      - discovery-server
    networks:
      - app-network

  order-service:
    image: surajshete49/docker-microservice-setup:order-service-1.1
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order-service
    depends_on:
      - postgres-order
      - discovery-server
    networks:
      - app-network

  inventory-service:
    image: surajshete49/docker-microservice-setup:inventory-service-1.1
    container_name: inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory-service
    depends_on:
      - postgres-inventory
      - discovery-server
    networks:
      - app-network

  notification-service:
    image: surajshete49/docker-microservice-setup:notification-service-1.1
    container_name: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - broker
      - discovery-server
    networks:
      - app-network


# -------------------- NETWORK & VOLUMES --------------------

networks:
  app-network:
    driver: bridge

volumes:
  postgres-order-data:
  postgres-inventory-data:
  mongo-data:
  mysql-keycloak-data:
