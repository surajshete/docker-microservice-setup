version: "3.8"

services:
  postgres-order:
    image: postgres
    container_name: postgres-order
    environment:
      POSTGRES_DB: order-service
      POSTGRES_USER: suraj
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres-order:/var/lib/postgresql/data/pgdata
    ports:
      - "6431:6431"
    command: ["postgres", "-p", "6431"]
    networks:
      - app-network
    restart: always

  postgres-inventory:
    image: postgres
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventory-service
      POSTGRES_USER: suraj
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres-inventory:/var/lib/postgresql/data/pgdata
    ports:
      - "6432:6432"
    command: ["postgres", "-p", "6432"]
    networks:
      - app-network
    restart: always

  mongo:
    image: mongo:4.4.14-rc0-focal
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    networks:
      - app-network
    restart: always

  keycloak-mysql:
    image: mysql:5.7
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    volumes:
      - ./mysql_keycloak_data:/var/lib/mysql
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL_HOST: keycloak-mysql
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8080
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./realms/:/opt/keycloak/data/import/
    networks:
      - app-network
    depends_on:
      - keycloak-mysql


  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  broker:
    image: confluentinc/cp-kafka:7.0.1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - app-network
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - app-network
    depends_on:
      - broker

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network

  discovery-server:
    image: surajshete49/docker-microservice-setup:discovery-server-1.1
    container_name: discovery-server
    ports:
      - "9761:9761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - app-network
    depends_on:
      - zipkin

  api-gateway:
    image: surajshete49/docker-microservice-setup:api-gateway-1.1
    container_name: api-gateway
    ports:
      - "9191:9191"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=TRACE
    networks:
      - app-network
    depends_on:
      - discovery-server

  product-service:
    image: surajshete49/docker-microservice-setup:product-service-1.1
    container_name: product-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - app-network
    depends_on:
      - discovery-server
      - mongo

  order-service:
    image: surajshete49/docker-microservice-setup:order-service-1.1
    container_name: order-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-order:6431/order-service
    networks:
      - app-network
    depends_on:
      - postgres-order
      - discovery-server

  inventory-service:
    image: surajshete49/docker-microservice-setup:inventory-service-1.1
    container_name: inventory-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-inventory:6432/inventory-service
    networks:
      - app-network
    depends_on:
      - postgres-inventory
      - discovery-server

  notification-service:
    image: surajshete49/docker-microservice-setup:notification-service-1.1
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - app-network
    depends_on:
      - broker
      - discovery-server

networks:
  app-network:
    driver: bridge
